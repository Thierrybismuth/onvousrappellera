<style>
:root{--marine:#161616;--accent:#f26b1d;--blanc:#f7f4ee;--gris:#6e6e6e;--rouge:#c0392b;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--blanc);color:var(--marine);min-height:100vh;}
#gate{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.box{background:#fff;border-radius:14px;padding:40px 30px;max-width:420px;width:100%;box-shadow:0 8px 28px rgba(0,0,0,.10);text-align:center;}
.lock{font-size:42px;margin-bottom:10px;}
h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin-bottom:8px;}
.sub{color:var(--gris);font-size:14px;margin-bottom:25px;}
input[type=password]{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid #d8d2c8;border-radius:8px;font-family:'Outfit';outline:none;}
input[type=password]:focus{border-color:var(--accent);}
button{width:100%;padding:12px;margin-top:14px;background:var(--marine);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;font-family:'Outfit';}
button:hover{background:#000;}
.err{color:var(--rouge);font-size:13px;margin-top:10px;min-height:18px;}
.spinner{border:3px solid #eee;border-top:3px solid var(--accent);border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style></head><body>

const PW_RING='tb_pw_ring';           /* localStorage : trousseau 7 jours (v4) */
const PW_KEY='tb_priv_pw';            /* sessionStorage : compat v2 */
const PW_KEY_D='tb_priv_pw_day';      /* localStorage : compat v3 */
const TTL_MS=7*24*60*60*1000;         /* 7 jours, fenetre glissante a chaque ouverture */
function ringRead(){var out=[];
  try{var a=JSON.parse(localStorage.getItem(PW_RING)||'[]'),now=Date.now();a=a.filter(function(o){return o&&o.pw&&o.exp>now;});localStorage.setItem(PW_RING,JSON.stringify(a));a.forEach(function(o){if(out.indexOf(o.pw)<0)out.push(o.pw);});}catch(e){}
  try{var raw=localStorage.getItem(PW_KEY_D);if(raw){var o=JSON.parse(raw);if(o&&o.pw&&o.exp>Date.now()&&out.indexOf(o.pw)<0)out.push(o.pw);}}catch(e){}
  try{var p=sessionStorage.getItem(PW_KEY);if(p&&out.indexOf(p)<0)out.push(p);}catch(e){}
  return out;}
function saveDay(pw){
  try{var a=[];try{a=JSON.parse(localStorage.getItem(PW_RING)||'[]');}catch(_){}a=a.filter(function(o){return o&&o.pw&&o.pw!==pw&&o.exp>Date.now();});a.unshift({pw:pw,exp:Date.now()+TTL_MS});localStorage.setItem(PW_RING,JSON.stringify(a.slice(0,8)));}catch(e){}
  try{sessionStorage.setItem(PW_KEY,pw);}catch(e){}}
function readDay(){var a=ringRead();return a.length?a[0]:null;}
function clearAll(){try{localStorage.removeItem(PW_KEY_D);}catch(e){}try{sessionStorage.removeItem(PW_KEY);}catch(e){}}
function b64dec(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decryptWith(pwd){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64dec(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64dec(PAYLOAD.iv)},key,b64dec(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
async function decryptAny(pwd){
  /* insensible a la casse : saisie brute, puis minuscules, puis majuscules */
  var p=String(pwd||'').trim();
  var variantes=[p,p.toLowerCase(),p.toUpperCase()],vus={},err=null;
  for(var i=0;i<variantes.length;i++){
    var c=variantes[i];
    if(!c||vus[c])continue;
    vus[c]=1;
    try{return {html:await decryptWith(c),pw:c};}catch(e){err=e;}
  }
  throw err||new Error('mot de passe incorrect');
}
function reveal(html){var g=document.getElementById('gate');if(g)g.remove();document.open();document.write(html);document.close();}
async function unlock(){
  const pwd=document.getElementById('pwd').value,errEl=document.getElementById('err'),btn=document.getElementById('btn');
  errEl.textContent='';btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  try{const r=await decryptAny(pwd);saveDay(r.pw);reveal(r.html);}
  catch(e){errEl.textContent='Mot de passe incorrect';btn.innerHTML='Déverrouiller';btn.disabled=false;document.getElementById('pwd').select();}
}
function showGate(){var g=document.getElementById('gate');if(g)g.style.display='flex';var p=document.getElementById('pwd');if(p)p.focus();}
async function tryAuto(){var list=ringRead();
  for(var i=0;i<list.length;i++){try{const r=await decryptAny(list[i]);saveDay(r.pw);reveal(r.html);return;}catch(e){}}
  clearAll();showGate();}
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
tryAuto();
</script></body></html>
