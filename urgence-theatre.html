<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--rouge:#d8281f;--noir:#161616;--gris:#6b7280;--gris-clair:#e7e2d8;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{background:#ffffff;color:var(--noir);font-family:'Outfit',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;}

  .accroche{margin-top:.6rem;font-size:clamp(1.15rem,5vw,1.4rem);font-weight:600;}
  .video{margin:22px auto 0;max-width:420px;}
  .video video{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#000;border:1px solid var(--gris-clair);}
  .tel{display:block;margin-top:26px;font-size:clamp(1.5rem,7vw,2rem);font-weight:700;color:var(--noir);text-decoration:none;line-height:1.25;}
  .tel span{color:var(--rouge);white-space:nowrap;text-decoration:underline;}
  .liens{margin-top:26px;font-size:1.1rem;}
  .liens p{margin-top:.8rem;}
  .liens a{color:var(--rouge);font-weight:600;text-decoration:underline;}

<main>

  <div class="video">

    </video>
  </div>

  <a class="tel" href="tel:+33610703090">Thierry Bismuth — <span>06 10 70 30 90</span></a>

  <div class="liens">
    <p><a href="https://onvousrappellera.fr/">Découvrir la pièce</a></p>
    <p><a href="https://onvousrappellera.fr/entreprises.html">Vous avez des clients entreprises ?</a></p>
