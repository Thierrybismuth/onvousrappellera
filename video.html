<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ON VOUS RAPPELLERA — la vidéo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#1b1b1b;font-family:'Outfit',Arial,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.titre{color:#d6201f;font-weight:600;letter-spacing:.02em;margin:4px 0 0;font-size:1.1rem}
.cadre{position:relative;width:100%}
video{width:100%;height:auto;display:block;background:#000;border-radius:4px}
#son{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#d6201f;color:#fff;border:0;border-radius:24px;padding:12px 22px;font:600 1rem 'Outfit',Arial,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#son[hidden]{display:none}
a{color:#1a5fb4;font-size:1rem;text-align:center}
.contact{color:#555;font-size:.95rem;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <p class="titre"><b>ON VOUS RAPPELLERA</b></p>
  <div class="cadre">
    <video id="v" autoplay muted playsinline controls preload="auto"></video>
    <button id="son" type="button">🔊 Activer le son</button>
  </div>
  <a id="lien" href="https://onvousrappellera.fr/franchise.html">Plus d'infos et choix de vos soirées</a>
  <p class="contact">Thierry Bismuth<br>06 10 70 30 90 — bismuththierry@gmail.com</p>
</div>
<script>
(function(){
  var p=new URLSearchParams(location.search), nom=(p.get('v')||'v02-palmares').replace(/[^a-z0-9-]/gi,'');
  var v=document.getElementById('v'), b=document.getElementById('son');
  v.src='assets/video/promo/'+nom+'.mp4'; v.poster='assets/video/promo/'+nom+'.jpg';
  if(p.get('page')==='entreprises') document.getElementById('lien').href='https://onvousrappellera.fr/entreprises.html';
  // Les navigateurs refusent le son sans geste de l'utilisateur : on lance en muet, puis on tente le son.
  v.muted=false; v.play().then(function(){b.hidden=true;}).catch(function(){v.muted=true;v.play().catch(function(){});});
  b.onclick=function(){v.muted=false;v.currentTime=0;v.play();b.hidden=true;};
  v.addEventListener('volumechange',function(){if(!v.muted)b.hidden=true;});
})();
</script>
</body>
</html>
